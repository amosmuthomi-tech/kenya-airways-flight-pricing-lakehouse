version: 2

models:
  - name: stg_flight_price_quotes
    description: >
      One row per valid fare quote per snapshot, passed through from the
      Silver PySpark job's `valid` output with no business logic applied.
      Grain: (airline, flight_code, source_city, destination_city,
      departure_time, arrival_time, stops, cabin_class, days_left, snapshot_date).
    columns:
      - name: source_row_index
        description: Original row index from the supplied CSV.
        tests: [not_null]
      - name: airline
        tests:
          - not_null
          - accepted_values:
              values: ['Indigo', 'GO_FIRST', 'SpiceJet', 'Vistara', 'AirAsia', 'Air_India']
      - name: cabin_class
        tests:
          - not_null
          - accepted_values:
              values: ['Economy', 'Business']
      - name: stops
        tests:
          - not_null
          - accepted_values:
              values: ['zero', 'one', 'two_or_more']
      - name: source_city
        tests: [not_null]
      - name: destination_city
        tests: [not_null]
      - name: price_inr
        tests: [not_null]
      - name: snapshot_date
        tests: [not_null]

  - name: stg_rejected_flight_price_quotes
    description: >
      One row per fare quote that Silver rejected, with the full list of
      reasons it failed. Source for the audit-layer rejected mart.
    columns:
      - name: source_row_index
        tests: [not_null]
      - name: reject_reason_count
        description: Number of validation rules this row failed (>= 1 by definition).
