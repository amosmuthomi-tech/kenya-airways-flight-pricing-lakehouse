<svg viewBox="0 0 1300 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="620" fill="#ffffff"/>
  <text x="30" y="35" font-size="20" font-weight="700" fill="#0f172a">Kenya Airways — Junior Data Engineer Assignment: Pipeline Architecture</text>
  <text x="30" y="58" font-size="13" fill="#64748b">Raw CSV &#8594; Bronze &#8594; Silver &#8594; dbt (staging/intermediate/core) &#8594; Gold marts &#8594; Redshift</text>

  <!-- Raw -->
  <rect x="30" y="120" width="150" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="155" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Raw CSV</text>
  <text x="105" y="175" font-size="11" fill="#475569" text-anchor="middle">airlines_flights_</text>
  <text x="105" y="190" font-size="11" fill="#475569" text-anchor="middle">data_YYYYMMDD.csv</text>

  <!-- Bronze -->
  <rect x="230" y="100" width="180" height="130" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="320" y="130" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle">Bronze (PySpark)</text>
  <text x="320" y="150" font-size="10.5" fill="#334155" text-anchor="middle">explicit schema, PERMISSIVE</text>
  <text x="320" y="165" font-size="10.5" fill="#334155" text-anchor="middle">+ ingestion metadata</text>
  <text x="320" y="180" font-size="10.5" fill="#334155" text-anchor="middle">partitioned by</text>
  <text x="320" y="195" font-size="10.5" fill="#334155" text-anchor="middle">_snapshot_date</text>
  <text x="320" y="212" font-size="10.5" fill="#334155" text-anchor="middle">dynamic overwrite</text>

  <!-- Silver -->
  <rect x="460" y="90" width="200" height="150" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="560" y="118" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Silver (PySpark)</text>
  <text x="560" y="138" font-size="10.5" fill="#334155" text-anchor="middle">validate + standardize</text>
  <text x="560" y="153" font-size="10.5" fill="#334155" text-anchor="middle">_reject_reasons array</text>
  <rect x="480" y="165" width="70" height="30" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="515" y="184" font-size="10" fill="#166534" text-anchor="middle">valid</text>
  <rect x="560" y="165" width="80" height="30" rx="6" fill="#fee2e2" stroke="#f87171"/>
  <text x="600" y="184" font-size="10" fill="#991b1b" text-anchor="middle">rejected</text>
  <text x="560" y="222" font-size="10" fill="#475569" text-anchor="middle">295,397 / 4,756</text>

  <!-- dbt -->
  <rect x="720" y="70" width="230" height="190" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="835" y="98" font-size="13" font-weight="700" fill="#78350f" text-anchor="middle">dbt (kq_flights)</text>
  <rect x="740" y="110" width="190" height="26" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="835" y="127" font-size="10.5" fill="#78350f" text-anchor="middle">staging (stg_*)</text>
  <rect x="740" y="144" width="190" height="26" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="835" y="161" font-size="10.5" fill="#78350f" text-anchor="middle">intermediate (int_*)</text>
  <rect x="740" y="178" width="190" height="26" rx="6" fill="#fffbeb" stroke="#fbbf24"/>
  <text x="835" y="195" font-size="10.5" fill="#78350f" text-anchor="middle">core: dim_airline, dim_route,</text>
  <text x="835" y="207" font-size="10" fill="#78350f" text-anchor="middle">fct_flight_price_quotes</text>
  <text x="835" y="240" font-size="10" fill="#92400e" text-anchor="middle">29 tests, docs, DuckDB dev target</text>

  <!-- Gold -->
  <rect x="1000" y="60" width="260" height="230" rx="10" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
  <text x="1130" y="88" font-size="13" font-weight="700" fill="#831843" text-anchor="middle">Gold marts (business-facing)</text>
  <rect x="1020" y="100" width="220" height="28" rx="6" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="1130" y="118" font-size="10" fill="#831843" text-anchor="middle">mart_airline_market_share</text>
  <rect x="1020" y="134" width="220" height="28" rx="6" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="1130" y="152" font-size="10" fill="#831843" text-anchor="middle">mart_route_price_trends</text>
  <rect x="1020" y="168" width="220" height="28" rx="6" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="1130" y="186" font-size="10" fill="#831843" text-anchor="middle">mart_daily_snapshot_summary</text>
  <rect x="1020" y="202" width="220" height="28" rx="6" fill="#fce7f3" stroke="#f9a8d4"/>
  <text x="1130" y="220" font-size="10" fill="#831843" text-anchor="middle">mart_cabin_class_performance</text>
  <text x="1130" y="255" font-size="9.5" fill="#9d174d" text-anchor="middle">+ audit.rejected_flight_price_quotes</text>

  <!-- Redshift -->
  <rect x="1000" y="340" width="260" height="150" rx="10" fill="#eef2ff" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1130" y="368" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">Amazon Redshift</text>
  <text x="1130" y="392" font-size="10.5" fill="#3730a3" text-anchor="middle">core.* (DISTKEY route_key,</text>
  <text x="1130" y="406" font-size="10.5" fill="#3730a3" text-anchor="middle">compound sortkey snapshot_date, airline)</text>
  <text x="1130" y="428" font-size="10.5" fill="#3730a3" text-anchor="middle">gold.* (DISTSTYLE EVEN)</text>
  <text x="1130" y="450" font-size="10.5" fill="#3730a3" text-anchor="middle">audit.* via Spectrum</text>
  <text x="1130" y="472" font-size="10" fill="#4338ca" text-anchor="middle">COPY + staging + MERGE load</text>

  <!-- arrows -->
  <path d="M180 165 H230" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M410 165 H460" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M660 165 H720" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M950 165 H1000 V175" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1130 290 V340" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- legend / manifest -->
  <rect x="230" y="270" width="180" height="60" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="320" y="292" font-size="10.5" fill="#475569" text-anchor="middle">Bronze manifest table</text>
  <text x="320" y="308" font-size="10.5" fill="#475569" text-anchor="middle">(batch_id, row counts, ts)</text>
  <path d="M320 230 V270" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <text x="30" y="560" font-size="11" fill="#64748b">Every stage is keyed/partitioned by _snapshot_date and overwrite/MERGE-based end to end —</text>
  <text x="30" y="578" font-size="11" fill="#64748b">reruns, duplicate file delivery, and late-arriving data never double-count. See documentation/incremental_strategy.md.</text>
</svg>
